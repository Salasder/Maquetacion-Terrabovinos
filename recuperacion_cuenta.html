<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Terrabovino - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="caja">
        <h2>TERRABOVINO</h2>
        <img src="Logo.png" class="logo-form" alt="logo">
        <h3 id="titulo">Recuperar contraseña</h3>
        <p id="subtitulo">Ingresa tu correo para enviarte un código.</p>

        <!-- aca se mete el correo donde me envia el codigo  -->
        <div id="correo">
            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com">
            </div>
            <button type="button" id="btn-paso1">Enviar código</button>
        </div>
 



<!-- aca para el codigo -->
     <div id="codigo">
       <div class="campo">
                <label for="código">Codigo</label>
          <input type="codigo" id="codigo" placeholder="*******">
            </div>
     <button type="button" id="btn-paso2"> Enviar código</button>
     </div>


<!--aca para la nueva contraseña-->
        <div id="Nueva contraseña">
            <div class="campo">
                <label for="Nueva contraseña">Nueva Contraseña</label>
                <input type="nueva contraseña" id="nueva contraseña" placeholder="*******">
            </div>



<!--verificar la nueva contraseña-->
             <div class="campo">
                <label for="confirmar  contraseña">Confirmar Contraseña</label>
                <input type="confirmar contraseña" id="confirmar contraseña" placeholder="*******">
            </div>
            <button type="button" id="btn-paso3"> Verificar nueva contraseña</button>
        </div>


        

        <div class="pie">
            <a href="index.html">Volver al login</a>
        </div>
    </div>

   
</body>
</html>
